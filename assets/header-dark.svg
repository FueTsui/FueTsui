<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Fue Tsui — Stay curious. Make something.</title>
<desc id="desc">A soft blue grid, the Mango cat mascot, and Fue Tsui's personal motto.</desc>
<defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#253248" stroke-width="0.65"/></pattern><clipPath id="round"><rect width="1200" height="360" rx="18"/></clipPath></defs>
<g clip-path="url(#round)"><rect width="1200" height="360" fill="#0d1117"/><ellipse cx="1020" cy="140" rx="360" ry="270" fill="#172b4d"/><rect width="1200" height="360" fill="url(#grid)"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="54" y="58" font-size="17" font-weight="600" letter-spacing="3" fill="#91a7ca">FUE TSUI</text><text x="52" y="153" font-size="64" font-weight="750" letter-spacing="-2" fill="#edf3ff">STAY CURIOUS</text><text x="52" y="228" font-size="64" font-weight="750" letter-spacing="-2" fill="#aac8ff">MAKE SOMETHING</text><path d="M54 264H1146" stroke="#303f58"/><text x="54" y="309" font-size="15" letter-spacing="2" fill="#91a7ca">DESKTOP TOOLS / AI AGENTS / SKILLS</text><text x="1146" y="309" text-anchor="end" font-size="15" fill="#91a7ca">fuetsui.com</text></g>
<circle cx="1010" cy="147" r="86" fill="#0d1117" stroke="#303f58"/>
